name: Supabase keepalive

# «Будильник»: бесплатный проект Supabase засыпает без обращений. Раз в три
# дня — один лёгкий запрос к базе (функция keepalive(), только чтение).
# Сайт не собирает и не публикует. Ошибка — красный запуск в Actions.
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Нет секретов VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY" >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 60 --retry 3 --retry-delay 20 --retry-all-errors \
            -X POST "${SUPABASE_URL%/}/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo
