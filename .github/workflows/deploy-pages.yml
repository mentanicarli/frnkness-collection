name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # content — пуш меняет только контент (lyrics/, audio/, images/,
      # lyrics-books/, src/content/*.json), как правки из админки: типы и
      # юнит-тесты от контента не зависят, их не гоняем. full — всё остальное.
      - name: Detect what changed
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMITS: ${{ toJSON(github.event.commits) }}
        run: npx vite-node scripts/ci-scope.ts

      - name: Typecheck
        if: steps.scope.outputs.scope != 'content'
        run: npm run typecheck

      - name: Run tests
        if: steps.scope.outputs.scope != 'content'
        run: npm run test:run

      - name: Check content
        run: npm run check:content

      - name: Build project
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
