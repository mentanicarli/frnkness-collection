name: CI

# Проверки для pull request (в том числе от Dependabot). Ничего не
# публикует: деплой — только deploy-pages.yml после пуша в main.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test:run

      - name: Check content
        run: npm run check:content

      # Без секретов: сборка берёт адрес Supabase по умолчанию из кода.
      - name: Build project
        run: npm run build
