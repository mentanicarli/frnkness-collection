<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">

    <title>frnk ness collection</title>
    <!--OG_TAGS-->
    <script>
        // Масштаб интерфейса на широких мониторах. Эталон — окно браузера
        // 1280×672 (внешний размер: 592px страницы + панель браузера), 1rem = 16px.
        // Считаем от outerWidth/outerHeight: они не меняются при зуме браузера,
        // поэтому Ctrl +/− работает поверх автомасштаба, как на обычном сайте.
        // Если масштаб 1 — inline-размер не ставим, остаётся размер браузера.
        (function () {
            var root = document.documentElement
            function applyScale() {
                var w = window.outerWidth, h = window.outerHeight
                var scale = w && h ? Math.max(1, Math.min(w / 1280, h / 672)) : 1
                root.style.fontSize = scale > 1 ? 16 * scale + 'px' : ''
            }
            applyScale()
            window.addEventListener('resize', applyScale)
        })()
    </script>
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">

        rel="stylesheet">
